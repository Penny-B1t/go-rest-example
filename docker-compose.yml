
services:
  # MariaDB 데이터베이스 서비스
  mariadb:
    image: mariadb:10.11
    container_name: iot_mariadb
    restart: unless-stopped
    env_file:
      - db.env
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - iot_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      timeout: 10s
      retries: 5
      interval: 30s
      start_period: 30s

  # Go REST API 애플리케이션
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iot_api
    restart: unless-stopped
    ports:
      - "9000:8080"
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - iot_network
    volumes:
      - ./firmware:/app/firmware:ro  # 펌웨어 파일용 볼륨
      - ./config:/app/config:ro

volumes:
  mariadb_data:
    driver: local

networks:
  iot_network:
    driver: bridge